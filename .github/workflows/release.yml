name: Release desktop runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: code-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
      - name: Restore native dependencies
        id: dependencies
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: code-deps-v1-${{ matrix.target }}-node24.16.0-${{ hashFiles('**/package-lock.json', 'scripts/sofik/setup.mjs', '.npmrc') }}
          path: |
            node_modules
            build/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/*/server/node_modules
      - name: Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 pkg-config libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev
      - run: npm run sofik:setup
        if: steps.dependencies.outputs.cache-hit != 'true'
      - name: Save native dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
          path: |
            node_modules
            build/node_modules
            extensions/node_modules
            extensions/*/node_modules
            extensions/*/server/node_modules
      - run: npm run sofik:build
      - run: node --test --test-reporter=tap --test-concurrency=1 --test-timeout=60000 scripts/sofik/*.test.mjs extensions/sofik-runtime/test/*.test.mjs
        timeout-minutes: 5
      - name: Core typecheck
        if: runner.os == 'Linux'
        run: |
          node build/npm/electronTypes.ts
          node node_modules/@typescript/native/lib/tsc.js -p src/tsconfig.json --noEmit --skipLibCheck
      - run: node scripts/sofik/bundle.mjs
      - name: Test the self-contained package
        timeout-minutes: 5
        run: |
          node scripts/sofik/smoke-bundle.mjs .build/desktop-runtime
      - run: node scripts/sofik/package-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: code-${{ matrix.target }}
          path: .build/release/*
          compression-level: 0
          retention-days: 3
  release:
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: code-*
          path: release
          merge-multiple: true
      - name: Publish complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sofik/publish-release.mjs release
